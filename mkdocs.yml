site_name: FORSTER
site_description: Fit Fe-Mg diffusion times to zoned olivine profiles
site_url: https://forster.readthedocs.io/
repo_url: https://github.com/whtowbin/Olivine_Diffusion_FeMg
repo_name: whtowbin/Olivine_Diffusion_FeMg
edit_uri: edit/master/docs/site/
copyright: FORSTER is released under the MIT licence.

# Only this folder is published. docs/plans and docs/references stay on GitHub (some of
# them hold round robin results that are private until that study is published).
docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - The desktop app: app.md
  - Preparing data: data.md
  - Setting up a run: setup.md
  - How the fit works: how-it-works.md
  - Uncertainty beyond the fit: uncertainty.md
  - Advanced: advanced.md
  - Reading the results: results.md
  - Column reference: columns.md
  - Python API: api.md
  - Glossary: glossary.md
  - Changelog and citing: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            filters: ["!^_"]
            show_if_no_docstring: false

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
