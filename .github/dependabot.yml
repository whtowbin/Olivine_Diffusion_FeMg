# Keeps the SHA-pinned actions in .github/workflows current: one grouped weekly PR,
# and only for releases at least 7 days old (time for a bad release to be caught).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
