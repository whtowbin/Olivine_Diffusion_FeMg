# Builds the throwaway PySide6 prototype (prototypes/gui_qt) with PyInstaller on all three
# systems, runs the bundle's own self-test headless, and keeps the bundle. The bundle's
# size, the self-test's wall time and three cold starts go to the job summary.
# Design and how the two GUI prototypes are compared: docs/plans/2026-10-15-gui.md.
name: gui-qt prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "prototypes/gui_qt/**"
      - ".github/workflows/gui-qt.yml"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen # no display on the runners
      PYTHONUTF8: "1" # Windows: the logs hold µ and σ
      # A python.org-style CPython from setup-python (shared libpython, which PyInstaller
      # needs), not a uv-managed build.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libglib2.0-0t64 libfontconfig1 libfreetype6 \
            libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Environment (forster with Numba, no dev or analysis groups)
        run: |
          uv sync --locked --no-default-groups --extra fast
          uv run --no-sync --with-requirements prototypes/gui_qt/requirements.txt \
            python -c "import sys, PySide6, PyInstaller, numba; print(sys.version, PySide6.__version__, PyInstaller.__version__, numba.__version__)"

      - name: Build the bundle
        run: |
          uv run --no-sync --with-requirements prototypes/gui_qt/requirements.txt \
            python prototypes/gui_qt/bundle.py build

      - name: Self-test the bundle (headless)
        run: |
          uv run --no-sync --with-requirements prototypes/gui_qt/requirements.txt \
            python prototypes/gui_qt/bundle.py test --out "prototypes/gui_qt/dist/report-${{ matrix.os }}.json"

      - name: Pack the bundle
        if: always()
        run: |
          uv run --no-sync python prototypes/gui_qt/bundle.py archive

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forster-qt-${{ matrix.os }}
          path: |
            prototypes/gui_qt/dist/*.zip
            prototypes/gui_qt/dist/*.tar.gz
            prototypes/gui_qt/dist/report-*.json
          if-no-files-found: warn
          compression-level: 0 # already compressed
