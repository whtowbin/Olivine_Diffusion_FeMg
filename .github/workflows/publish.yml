name: Publish to PyPI

# Trusted publishing (no API tokens): PyPI and TestPyPI each need a "pending publisher"
# for this repository, this workflow file and the environment named below (see
# docs/releasing.md). A manual run publishes to TestPyPI; a version tag (v0.1.0, ...)
# publishes to PyPI. Actions are pinned to commit SHAs (the tag in a comment), and
# Dependabot proposes updates. Check with `uvx zizmor .github/workflows/` after a change.
# The OIDC token is minted only inside the `pypi`/`testpypi` environments, so the
# environment's required reviewer gates every publish (docs/releasing.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Read-only by default; only the publish jobs get the OIDC token they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the build runs third-party code; keep the token out of .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false # a release build must not restore a cache another run could have poisoned
      - name: Build sdist and wheel
        run: uv build
      - name: Check the metadata
        run: uvx twine check dist/*
      - name: Install the wheel in a clean environment and run the worked example
        run: |
          uv venv /tmp/check --python 3.12
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/check/bin/forster template example
          cd example
          /tmp/check/bin/forster fit profiles.csv parameters.csv --out results
          test -s results/summary.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (fixes GHSA-vxmw-7h4f-hqxh)
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (fixes GHSA-vxmw-7h4f-hqxh)
