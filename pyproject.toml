[project]
name = "forster"
version = "0.1.0.dev0"
description = "FORSTER olivine diffusion: fit Fe-Mg diffusion times to zoned olivine profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Henry Towbin" }]
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pykrige>=1.7.2",
    "scipy>=1.16.1",
]

[project.scripts]
forster = "forster.cli:main"

[project.optional-dependencies]
fast = [
    "numba>=0.61",
]

[dependency-groups]
dev = [
    "complexipy>=4.0",
    "numba>=0.61",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.14",
    "ty>=0.0.1a20",
]
# Used by the research scripts at the repo root (round robin analysis), not by the package.
analysis = [
    "cycler>=0.12.1",
    "great-tables>=0.21.0",
    "ipykernel>=6.30.1",
    "marimo>=0.20.2",
    "mplstereonet>=0.6.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "selenium>=4.41.0",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]
# engine.py and orientation.py are moved unchanged from the research code (apart from the
# 2026-10-11 cross-term fix); tests/reference holds a verbatim copy of the old model_diffusion.
# They are kept as they are so their diffs stay reviewable; clean them up in a separate change.
extend-exclude = [
    "src/forster/engine.py",
    "src/forster/orientation.py",
    "tests/reference",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "src/forster/engine.py",
    "src/forster/orientation.py",
    "tests/reference",
]

[tool.ty.environment]
python-version = "3.11"
