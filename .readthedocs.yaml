# Read the Docs: builds the MkDocs site in docs/site (mkdocs.yml) with uv, from the
# locked docs dependency group only (not the dev or analysis groups).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --frozen --no-default-groups --group docs --python 3.12
    - uv run --frozen --no-sync mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

# The round robin data are a private submodule; the site does not need them.
submodules:
  exclude: all
